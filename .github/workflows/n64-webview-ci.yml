name: N64 WebView Android build and smoke
on:
  push:
    paths:
      - '.github/workflows/n64-webview-ci.yml'
      - 'n64-webview-source.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -o n64-webview-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: n64-webview
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: n64-webview-debug-apk
          path: n64-webview/app/build/outputs/apk/debug/app-debug.apk
