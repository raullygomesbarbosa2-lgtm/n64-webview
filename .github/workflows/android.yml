name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  viewport-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node app/src/test/js/viewport.test.js
  build:
    needs: viewport-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: n64-webview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.raully.n64webview/.MainActivity
            sleep 25
            adb shell uiautomator dump /sdcard/view.xml >/dev/null
            adb pull /sdcard/view.xml view.xml
            grep -q 'N64 Wasm' view.xml
            adb logcat -d | grep -E 'FATAL EXCEPTION|WebView.*(net::ERR|Uncaught)' && exit 1 || true
